[build]
  command = "node --version && npm --version && npm install --legacy-peer-deps && npm run build"
  publish = ".next"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  CLOUDINARY_URL = "cloudinary://placeholder:placeholder@placeholder"
  NPM_FLAGS = "--legacy-peer-deps"
  NODE_OPTIONS = "--max-old-space-size=4096"

[[notifications]]
  event = "submission_created"
  url = "https://josh.jam-bot.com/social-api/api/leads/webhook/netlify?tenant=josh&site=sprayfoamtv.com"
  form = "contact"

[[redirects]]
  from = "/stream/hls/*"
  to = "https://games.jam-bot.com/stream/hls/:splat"
  status = 200
  force = true

# HLS playlist must never be cached (edge or browser) — a stale m3u8 after a
# stream restart leaves players black. Segments are monotonically numbered so
# they are safe too; no-store everywhere is simplest and correct.
[[headers]]
  for = "/stream/hls/*"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

[[plugins]]
  package = "@netlify/plugin-nextjs"
